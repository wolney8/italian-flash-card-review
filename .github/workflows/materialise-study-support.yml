name: Materialise verified study support
on:
  push:
    branches: [fix/study-navigation-support-20261111]
    paths: ['.study-support-transfer/**', '.github/workflows/materialise-study-support.yml']
permissions:
  contents: write
jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/study-navigation-support-20261111
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check transfer and apply exact guarded changes
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma
          from pathlib import Path
          raw=base64.b64decode(''.join(Path('.study-support-transfer/part%d.b64'%i).read_text().strip() for i in range(1,4)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='305c0f664d60f9ba231c20afd91ada8430d5bcedaf9a075a16dd9cfde569f81d','Source transfer checksum mismatch'
          bundle=json.loads(lzma.decompress(raw))
          allowed={'study/question-support-v1.js','study/question-support-v1.css','scripts/validate_study_support.cjs','scripts/validate_study_support.py','study-support-patches.json'}
          assert set(bundle)==allowed
          patches=json.loads(bundle.pop('study-support-patches.json'))
          assert {p['path'] for p in patches}=={'study/study-sheets.html','study/guided-sheet-pilot-v1.js','study/study-sheets-v5.js'}
          for p in patches:
              target=Path(p['path']);text=target.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==p['before'],p['path']+' base changed'
              for edit in reversed(p['edits']):
                  a,b=edit['start'],edit['end'];assert text[a:b]==edit['old'];text=text[:a]+edit['new']+text[b:]
              assert hashlib.sha256(text.encode()).hexdigest()==p['after'],p['path']+' patch differs'
              target.write_text(text)
          for name,text in bundle.items():
              target=Path(name);target.parent.mkdir(parents=True,exist_ok=True);target.write_text(text)
          PY
      - name: Validate before saving
        run: |
          node --check study/question-support-v1.js
          node --check study/study-sheets-v5.js
          node --check study/guided-sheet-pilot-v1.js
          node scripts/validate_study_support.cjs
          node scripts/validate_guided_sheet_pilot.cjs
      - name: Save only reviewed changes and remove transfer files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study/question-support-v1.js study/question-support-v1.css scripts/validate_study_support.cjs scripts/validate_study_support.py study/study-sheets.html study/guided-sheet-pilot-v1.js study/study-sheets-v5.js
          git rm -r .study-support-transfer .github/workflows/materialise-study-support.yml
          git commit -m 'Fix checked-answer navigation and add question-specific learning support'
          git push origin HEAD:fix/study-navigation-support-20261111
      - name: Test actual browser interactions
        run: |
          python -m pip install playwright==1.57.0
          python scripts/validate_study_support.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transferred-study-support-review
          path: artifacts/study-support
          retention-days: 3
