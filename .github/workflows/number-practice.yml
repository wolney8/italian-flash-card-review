name: Number writing practice
on:
  push:
    branches: [feature/number-writing-practice-20261109, main]
  pull_request:
    paths: ['lesson6/**', 'scripts/*number_practice*', '.github/workflows/number-practice.yml']
permissions:
  contents: write
jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow number-practice transformation
        run: python scripts/expand_number_practice.py
      - name: Validate numbers and existing content contracts
        run: |
          node --check lesson6/content.js
          node scripts/validate_number_practice.cjs
          node scripts/validate_lesson6.cjs
          node scripts/validate_study_flow.cjs
          python lesson6/install.py
      - name: Install web testing only
        run: python -m pip install playwright==1.57.0
      - name: Test complete exercise and saved sessions on desktop and phone
        run: python scripts/validate_number_practice_browser.py
      - name: Persist verified changes on feature branch only
        if: github.event_name == 'push' && github.ref_name == 'feature/number-writing-practice-20261109'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lesson6/content.js lesson6/flow-preservation.json lesson6/README.md lesson6/install.py index.html study/study-sheets.html scripts/validate_lesson6.cjs scripts/validate_study_flow.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Expand number writing to 0–30 and ten larger numbers; preserve matching progress'
            git push origin HEAD:feature/number-writing-practice-20261109
          fi
      - name: Capture exact validated source
        if: always()
        run: git archive --format=zip HEAD -o /tmp/number-practice-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: number-practice-review
          path: |
            artifacts/number-practice
            /tmp/number-practice-source.zip
          retention-days: 7
