name: Lesson 6 validation
on:
  push:
    branches: [feature/lesson6-source-grounded-20261106]
  pull_request:
    paths: ['lesson6/**', 'scripts/*lesson6*', '.github/workflows/lesson6-validation.yml']
permissions:
  contents: read
jobs:
  lesson6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build and test dependencies
        run: python -m pip install genanki==0.13.1 playwright==1.57.0
      - name: Validate canonical lesson and preserved earlier data
        run: |
          python lesson6/install.py
          git diff --exit-code
          node --check lesson6/content.js
          node --check course-data-loader-v1.js
          node --check guided-course-v2.js
          node --check pronunciation-decisions-v628.js
          node --check study/study-sheets-v5.js
          node scripts/validate_lesson6.cjs
          node scripts/validate_theme_contrast.cjs
          node scripts/validate_warm_editorial.cjs
      - name: Build Anki and interactive review preview
        run: python lesson6/build.py
      - name: Test integrated Lesson 6 on desktop and mobile
        run: python scripts/validate_lesson6_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson6-review-candidate
          path: |
            artifacts/lesson6
            artifacts/lesson6-browser
          retention-days: 14
