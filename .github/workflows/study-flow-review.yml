name: Study flow review
on:
  push:
    branches: [main, fix/lesson-flow-and-study-navigation-20261106]
    paths: ['lesson7/**', 'study/**', 'lesson6/**', 'scripts/*study_flow*', 'course-site-header-v1.js', 'guided-course-v2.js', 'index.html', '.github/workflows/study-flow-review.yml']
  pull_request:
    paths: ['lesson7/**', 'study/**', 'lesson6/**', 'scripts/*study_flow*', 'course-site-header-v1.js', 'guided-course-v2.js', 'index.html', '.github/workflows/study-flow-review.yml']
permissions:
  contents: read
concurrency:
  group: study-flow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web test dependency only
        run: python -m pip install playwright==1.57.0
      - name: Validate source sequence and preservation
        run: |
          python lesson6/install.py
          git diff --exit-code
          node --check course-site-header-v1.js
          node --check guided-course-v2.js
          node --check lesson6/content.js
          node --check study/study-sheets-v5.js
          node --check study/guided-sheet-pilot-v1.js
          node scripts/validate_study_flow.cjs
          node scripts/validate_lesson6.cjs
      - name: Test class order, homework selection, old links and saved answers
        run: python scripts/validate_study_flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-flow-review
          path: artifacts/study-flow
          retention-days: 7
