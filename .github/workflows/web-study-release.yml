name: Web study release
on:
  push:
    branches: [main, release/web-study-ready-20261110]
    paths: ['study/**', 'lesson6/**', 'scripts/validate_web_study_release.py', '.github/workflows/web-study-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0
      - name: Check JavaScript and existing course content
        run: |
          node --check study/study-ready-tools.js
          node --check study/verb-reference-v1.js
          node scripts/validate_lesson6.cjs
          node scripts/validate_warm_editorial.cjs
      - name: Test real study tools on desktop and phone
        run: python scripts/validate_web_study_release.py
      - name: Verify deployed production after merge
        if: github.ref_name == 'main'
        run: python scripts/validate_web_study_release.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-study-release
          path: artifacts/web-study-release
          retention-days: 7
