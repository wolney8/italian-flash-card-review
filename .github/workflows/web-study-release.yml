name: Web study release
on:
  push:
    branches: [main, release/web-study-ready-20261110]
    paths: ['study/**', 'lesson6/**', 'scripts/validate_web_study_release.py', '.github/workflows/web-study-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0
      - name: Test study release when present
        run: |
          if [ -f scripts/validate_web_study_release.py ]; then python scripts/validate_web_study_release.py; fi
      - name: Inspect actual production site
        run: |
          mkdir -p artifacts/web-study-release
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base='https://italian-flash-card-review.netlify.app'
          result={}
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':390,'height':844})
              errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              try:
                  page.goto(base+'/?page=card&lesson=L6',wait_until='networkidle',timeout=60000)
                  page.wait_for_selector('.guided-card-host .review-card',timeout=30000)
                  result['flashcards']=page.evaluate('({cards:cards.filter(c=>c.lesson==="L6").length,topics:[...new Set(cards.filter(c=>c.lesson==="L6").map(c=>c.deck))]})')
                  page.goto(base+'/study/study-sheets.html?mode=learn&sheet=l6-number-patterns',wait_until='networkidle')
                  page.wait_for_selector('.guided-sheet-steps')
                  result['numbers']={'questions':page.locator('.quiz-question').count(),'flip_mode':page.locator('[data-number-reveal-mode]').count(),'title':page.locator('.study-pack-sheet > header h1').inner_text()}
                  page.screenshot(path='artifacts/web-study-release/production-numbers.png',full_page=True)
                  result['page_errors']=errors
                  result['reachable']=True
              except Exception as e:
                  result['reachable']=False;result['error']=str(e)
              browser.close()
          Path('artifacts/web-study-release/production-inspection.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Preserve exact public source snapshot
        run: git archive HEAD -o artifacts/web-study-release/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-study-release
          path: artifacts/web-study-release
          retention-days: 3
