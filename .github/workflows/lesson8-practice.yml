name: Lesson 8 practice
on:
  pull_request:
    paths: &practice_paths
      - 'lesson8-practice/**'
      - 'course-data-loader-v1.js'
      - 'course-card-front-v1.js'
      - 'early-card-tasks.js'
      - 'guided-course-v2.js'
      - 'index.html'
      - 'study/job-photos/**'
      - 'study/jobs-in-photos.*'
      - 'study/visual-exercises.*'
      - 'study/visual-return.js'
      - 'study/daily-verbs.js'
      - 'study/daily-practice.*'
      - 'course-practice-routes-v1.js'
      - 'course-site-header-v1.*'
      - 'editorial-theme-v1.css'
      - 'course-shell-boot-v1.js'
      - 'course-ui-language-v1.js'
      - 'study/study-sheets.html'
      - 'study/study-sheets-v5.js'
      - 'study/library-v1.js'
      - 'study/guided-sheet-pilot-v1.js'
      - 'learning-controls-v2.js'
      - 'scripts/validate_l8_extra_browser.py'
      - 'scripts/validate_navigation_consistency.cjs'
      - 'scripts/validate_practice_navigation.py'
      - 'scripts/validate_worksheet_tasks.cjs'
      - 'scripts/validate_recall_layout.cjs'
      - '.github/workflows/lesson8-practice.yml'
  push:
    branches: [main]
    paths: *practice_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lesson8-practice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check worksheet directions, flashcard fronts and answer keys
        run: |
          node scripts/validate_navigation_consistency.cjs
          node scripts/validate_worksheet_tasks.cjs
          node scripts/validate_recall_layout.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test Lesson 8 worksheets, flashcards and visual activities
        run: python scripts/validate_l8_extra_browser.py
