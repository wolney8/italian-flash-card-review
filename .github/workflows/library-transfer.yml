name: Prepare lesson library
on:
  push:
    branches: [feature/lesson-first-library-20261111]
    paths: ['library-transfer/**', '.github/workflows/library-transfer.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact local source changes when all parts are present
        id: materialise
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,base64,lzma,hashlib,json
          parts=[Path('library-transfer/part%d.b64'%n) for n in range(1,5)]
          if not all(p.exists() for p in parts):
              print('Transfer incomplete; source unchanged.')
              raise SystemExit(0)
          packed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='8f77fed45c6216175bfd8b52ce2d11bce82d51c3f8d4277b031892c1e0bc64d7'
          changes=json.loads(lzma.decompress(packed))
          for name,item in changes.items():
              if name.startswith('.github/'):continue
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.suffix in ('.js','.css','.html','.py','.cjs','.json')
              if 'content' in item:
                  assert not path.exists(),name
                  content=item['content']
              else:
                  old=path.read_text()
                  assert hashlib.sha256(old.encode()).hexdigest()==item['before'],name
                  content=old
                  for start,end,replacement in reversed(item['edits']):
                      content=content[:start]+replacement+content[end:]
              assert hashlib.sha256(content.encode()).hexdigest()==item['sha256'],name
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready=true\n')
          PY
      - name: Validate source and retain feature-branch changes
        if: steps.materialise.outputs.ready == 'true'
        run: |
          node scripts/validate_course_library.cjs
          node scripts/validate_repeatable_practice.cjs
          node scripts/validate_lesson6.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course-*.js course-*.css guided-course-v2.js index.html scripts study docs/library-source-preservation.json
          git rm -r library-transfer
          git commit -m 'Implement lesson-first study library, connected practice and stable loading'
          git push origin HEAD:feature/lesson-first-library-20261111
      - name: Install browser validation
        if: steps.materialise.outputs.ready == 'true'
        run: python -m pip install playwright==1.57.0
      - name: Check complete user journey
        if: steps.materialise.outputs.ready == 'true'
        run: python scripts/validate_course_library_browser.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.materialise.outputs.ready == 'true'
        with:
          name: course-library-review
          path: artifacts/course-library
          retention-days: 7
