name: Learning controls v2
on:
  push:
    branches: [main, feature/learning-controls-20261112]
    paths: ['learning-*.js', 'learning-*.css', 'guided-course-v2.js', 'study/**', 'index.html', 'scripts/*learning_controls*', '.github/workflows/learning-controls-v2.yml']
  pull_request:
    paths: ['learning-*.js', 'learning-*.css', 'guided-course-v2.js', 'study/**', 'index.html', 'scripts/*learning_controls*', '.github/workflows/learning-controls-v2.yml']
permissions:
  contents: read
concurrency:
  group: learning-controls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed integration once on the feature branch
        if: github.event_name == 'push' && github.ref_name == 'feature/learning-controls-20261112' && hashFiles('scripts/integrate_learning_controls_v2.py') != ''
        run: |
          python scripts/integrate_learning_controls_v2.py
          node --check learning-controls-v2.js
          node --check guided-course-v2.js
          node --check study/guided-sheet-pilot-v1.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study/guided-sheet-pilot-v1.js guided-course-v2.js learning-session-v1.js index.html study/study-sheets.html learning-controls-v2.js
          git rm scripts/integrate_learning_controls_v2.py
          git commit -m 'Integrate gated practice and adaptive flashcard controls'
          git push origin HEAD:feature/learning-controls-20261112
      - name: Preserve canonical content and answer support
        run: |
          node scripts/validate_course_library.cjs
          node scripts/validate_study_support.cjs
          node scripts/validate_lesson6.cjs
          node --check learning-controls-v2.js
      - run: python -m pip install playwright==1.57.0
      - name: Test countdowns, review isolation, quitting and flashcards
        run: python scripts/validate_learning_controls_v2.py
      - name: Verify actual Netlify deployment
        if: github.ref_name == 'main'
        run: python scripts/validate_learning_controls_v2.py --live
      - name: Save source and diagnostics
        if: always()
        run: |
          mkdir -p artifacts/learning-controls
          git archive HEAD -o artifacts/learning-controls/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-controls-v2
          path: artifacts/learning-controls
          retention-days: 7
