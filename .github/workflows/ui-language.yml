name: Interface language
on:
  push:
    branches: [main, feature/site-ui-language-20261111]
    paths: ['course-ui-*', 'index.html', 'study/**', 'scripts/validate_ui_language.py', '.github/workflows/ui-language.yml']
  pull_request:
    paths: ['course-ui-*', 'index.html', 'study/**', 'scripts/validate_ui_language.py', '.github/workflows/ui-language.yml']
permissions:
  contents: read
jobs:
  language:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0
      - name: Test language switching when present
        run: |
          if [ -f scripts/validate_ui_language.py ]; then
            node --check course-ui-language-v1.js
            node --check course-ui-italian-v1.js
            python scripts/validate_ui_language.py
          fi
      - name: Preserve exact public source and test results
        if: always()
        run: |
          mkdir -p artifacts/ui-language
          git archive HEAD -o artifacts/ui-language/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-language-review
          path: artifacts/ui-language
          retention-days: 7
