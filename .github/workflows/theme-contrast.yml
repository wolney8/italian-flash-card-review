name: Theme contrast

on:
  push:
  pull_request:

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate_theme_contrast.cjs
      - run: node scripts/validate_navigation_consistency.cjs
      - run: node scripts/validate_study_typography.cjs
      - run: node --check study/guided-sheet-pilot-v1.js
      - run: node scripts/validate_guided_sheet_pilot.cjs
      - run: node --check learning-session-v1.js
      - run: node --check guided-course-v2.js
      - run: node scripts/validate_learning_session.cjs
