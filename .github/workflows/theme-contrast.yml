name: Theme contrast

on:
  push:
  pull_request:

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate_theme_contrast.cjs
      - run: node scripts/validate_navigation_consistency.cjs
