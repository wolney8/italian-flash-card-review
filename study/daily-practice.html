<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/course-practice-routes-v1.js?v=1"></script>
  <title>Daily practice | Italian for Beginners</title>
  <link rel="stylesheet" href="daily-practice.css">
</head>
<body>
  <main class="course-practice daily-page">
    <div class="intro"><h1>Daily practice</h1><p>Choose a topic. Practise eight questions at your own pace.</p></div>
    <div class="workspace">
      <aside id="topics">
        <h2>Practice topics</h2>
        <nav id="topic-buttons" aria-label="Practice topics"></nav>
        <h2 class="visual-topic-heading">Visual exercises</h2>
        <nav class="visual-topic-links" aria-label="Visual exercises">
          <a href="/?page=visual-exercises&amp;activity=verbs">Match verb endings</a>
          <a href="/?page=visual-exercises&amp;activity=forms">Match whole verb forms</a>
          <a href="/?page=visual-exercises&amp;activity=articles">Match articles</a>
          <a href="/?page=visual-exercises&amp;activity=numbers">Match Italian numbers</a>
          <a href="/?page=visual-exercises&amp;activity=sounds">Sort C and G sounds</a>
          <a href="/?page=visual-exercises&amp;activity=sentence">Build a sentence</a>
          <a href="/?page=jobs-in-photos">Jobs in photographs</a>
        </nav>
      </aside>
      <section id="work" aria-labelledby="topic-title">
        <div class="topic-head"><h2 id="topic-title"></h2><p lang="en-GB" id="topic-intro"></p></div>
        <div id="filters" class="filters" hidden>
          <label>Verb group<select id="group"><option value="all">All verbs</option><option value="regular">Regular verbs</option><option value="irregular">Irregular verbs</option></select></label>
          <label>Practise a verb<select id="verb"></select></label>
          <label id="focus-label">Practise<select id="focus"></select></label>
        </div>
        <details id="reference"><summary id="ref-title">Quick reference</summary><div id="ref-body" lang="en-GB" data-ui-no-translate></div></details>
        <div id="exercise"></div>
      </section>
    </div>
    <noscript>Enable JavaScript to practise the exercises.</noscript>
  </main>
</body>
</html>
