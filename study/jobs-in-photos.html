<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203d34">
  <title>Jobs in photographs | Italian for Beginners</title>
  <link rel="stylesheet" href="daily-practice.css?v=visual1">
  <link rel="stylesheet" href="jobs-in-photos.css">
  <script src="visual-return.js" defer></script>
</head>
<body>
  <header class="coursebar">
    <a class="brand" href="../?page=home"><span class="brandmark" aria-hidden="true">it.</span> Italian for Beginners</a>
    <nav aria-label="Course"><a data-back-to-sheet href="study-sheets.html?sheet=l8-jobs-workplaces&amp;stage=practise&amp;mode=learn">Lesson 8 study sheet</a><a href="daily-practice.html">Daily practice</a></nav>
  </header>
  <main>
    <div class="intro"><h1>Jobs in photographs</h1><p>Look at the work taking place. Choose the Italian name for the job.</p></div>
    <section class="panel photo-panel" aria-label="Photo exercise">
      <p id="photo-state" role="status">Loading photographs…</p>
      <button type="button" class="secondary" id="retry-photos" hidden>Try loading again</button>
      <div id="photo-question" hidden>
        <p class="meter" id="photo-count"></p>
        <div class="photo-and-answers">
          <figure><img id="job-photo" alt=""></figure>
          <div>
            <form id="job-form">
              <fieldset id="job-choices">
                <legend id="photo-prompt" tabindex="-1">Which job is shown?</legend>
                <div id="job-options"></div>
              </fieldset>
              <details id="hint"><summary>Hint</summary><p></p></details>
              <button type="submit" class="primary" id="check-job">Check answer</button>
            </form>
            <div id="job-feedback" role="status" aria-live="polite" aria-atomic="true"></div>
            <button type="button" class="primary" id="next-photo" hidden>Next photograph</button>
          </div>
        </div>
        <details id="photo-credit"><summary>Photograph and source</summary><p id="photo-attribution"></p></details>
      </div>
      <div id="photo-complete" hidden>
        <h2 tabindex="-1">Round complete</h2>
        <p id="photo-score"></p>
        <button type="button" class="primary" id="restart-photos">Practise again</button>
      </div>
    </section>
    <noscript>Enable JavaScript to answer the photo questions.</noscript>
  </main>
  <script src="jobs-in-photos.js"></script>
</body>
</html>
