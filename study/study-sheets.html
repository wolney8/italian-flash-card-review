</head>
<body>
<main id="top">
  <section class="study-course-shell" aria-label="Choose Learn or Review">
    <div class="study-course-copy">
      <strong id="studyModeLabel">Learn · Study Sheets</strong>
      <div id="studyOverallProgress" class="study-overall-progress" aria-live="polite">No study questions attempted in this session yet.</div>
    </div>
    <div class="study-course-actions">
      <a id="backToFlashcards" class="button secondary" href="../?mode=learn&view=flashcards">Flashcards</a>
      <div class="study-mode-switch" role="group" aria-label="Learn or Review mode">
        <button type="button" class="study-mode-button" data-study-mode="learn">Learn</button>
        <button type="button" class="study-mode-button" data-study-mode="review">Review</button>
      </div>
      <button type="button" class="study-session-reset" data-reset-study-session>Reset this session</button>
    </div>
  </section>

  <header class="hero">
    <h1>Study sheets</h1>
    <div class="actions top-actions">
      <a id="backToStudyMenu" class="button" href="../?mode=learn&view=study">Back to study-sheet menu</a>
      <button class="button secondary" type="button" onclick="window.print()">Print / save as PDF</button>
    </div>
  </header>
  <nav id="studyNav" class="study-pack-menu" aria-label="Study sheets"></nav>
  <div id="studySheets"></div>
</main>

<iframe id="studyReviewSink" name="studyReviewSink" title="Study sheet comment submission" aria-hidden="true" hidden></iframe>
<div id="studyReviewModal" class="study-review-modal" hidden>
  <div class="study-review-backdrop" data-close-study-review></div>
  <section class="study-review-dialog" role="dialog" aria-modal="true" aria-labelledby="studyReviewTitle">
    <p class="eyebrow">Review feedback</p>
    <h2 id="studyReviewTitle">Comment on this study sheet</h2>
    <form id="studyReviewForm">
      <input type="hidden" id="studyReviewSheet">
      <label for="studyReviewer">Name or initials</label>
      <input id="studyReviewer" maxlength="80" autocomplete="name" required>
      <label for="studyReviewComment">Comment</label>
      <textarea id="studyReviewComment" maxlength="4000" required placeholder="What should be checked or changed?"></textarea>
      <div class="study-review-buttons">
        <button type="button" class="button secondary" data-close-study-review>Cancel</button>
        <button type="submit" class="button">Send comment</button>
      </div>
      <div id="studyReviewStatus" class="study-review-status" aria-live="polite"></div>
    </form>
  </section>
</div>
<script src="../lesson6/content.js?v=20261109numbers" defer></script>

<script src="study-ready-tools.js?v=20261110a" defer></script>
</body>
</html>
